apiVersion: v1
kind: Namespace
metadata:
  name: bluearch-eks-lab
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: missing-requests-api, namespace: bluearch-eks-lab }
spec:
  replicas: 1
  selector: { matchLabels: { app: missing-requests-api } }
  template:
    metadata: { labels: { app: missing-requests-api } }
    spec:
      containers:
        - name: app
          image: __NGINX_IMAGE__
          resources: { limits: { cpu: 250m, memory: 128Mi } }
          readinessProbe: { httpGet: { path: /, port: 80 } }
          livenessProbe: { httpGet: { path: /, port: 80 } }
          securityContext: { allowPrivilegeEscalation: false }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: missing-memory-limit-api, namespace: bluearch-eks-lab }
spec:
  replicas: 1
  selector: { matchLabels: { app: missing-memory-limit-api } }
  template:
    metadata: { labels: { app: missing-memory-limit-api } }
    spec:
      containers:
        - name: app
          image: __NGINX_IMAGE__
          resources: { requests: { cpu: 50m, memory: 32Mi }, limits: { cpu: 250m } }
          readinessProbe: { httpGet: { path: /, port: 80 } }
          livenessProbe: { httpGet: { path: /, port: 80 } }
          securityContext: { allowPrivilegeEscalation: false }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: missing-probes-api, namespace: bluearch-eks-lab }
spec:
  replicas: 1
  selector: { matchLabels: { app: missing-probes-api } }
  template:
    metadata: { labels: { app: missing-probes-api } }
    spec:
      containers:
        - name: app
          image: __NGINX_IMAGE__
          resources: { requests: { cpu: 50m, memory: 32Mi }, limits: { cpu: 250m, memory: 128Mi } }
          securityContext: { allowPrivilegeEscalation: false }
---
apiVersion: v1
kind: Service
metadata: { name: missing-probes-api, namespace: bluearch-eks-lab }
spec:
  selector: { app: missing-probes-api }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: unprotected-api, namespace: bluearch-eks-lab }
spec:
  replicas: 2
  selector: { matchLabels: { app: unprotected-api } }
  template:
    metadata: { labels: { app: unprotected-api } }
    spec:
      containers:
        - name: app
          image: __NGINX_IMAGE__
          resources: { requests: { cpu: 50m, memory: 32Mi }, limits: { cpu: 250m, memory: 128Mi } }
          readinessProbe: { httpGet: { path: /, port: 80 } }
          livenessProbe: { httpGet: { path: /, port: 80 } }
          securityContext: { allowPrivilegeEscalation: false }
---
apiVersion: v1
kind: Service
metadata: { name: unprotected-api, namespace: bluearch-eks-lab }
spec:
  selector: { app: unprotected-api }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: privileged-worker, namespace: bluearch-eks-lab }
spec:
  replicas: 1
  selector: { matchLabels: { app: privileged-worker } }
  template:
    metadata: { labels: { app: privileged-worker } }
    spec:
      containers:
        - name: worker
          image: __BUSYBOX_IMAGE__
          command: ["sh", "-c", "sleep 28800"]
          resources: { requests: { cpu: 10m, memory: 8Mi }, limits: { cpu: 100m, memory: 32Mi } }
          readinessProbe: { exec: { command: ["sh", "-c", "true"] } }
          livenessProbe: { exec: { command: ["sh", "-c", "true"] } }
          securityContext: { privileged: true, allowPrivilegeEscalation: true }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: crashloop-api, namespace: bluearch-eks-lab }
spec:
  replicas: 1
  selector: { matchLabels: { app: crashloop-api } }
  template:
    metadata: { labels: { app: crashloop-api } }
    spec:
      containers:
        - name: app
          image: __BUSYBOX_IMAGE__
          command: ["sh", "-c", "echo fixture-crash >&2; exit 17"]
          resources: { requests: { cpu: 10m, memory: 8Mi }, limits: { cpu: 100m, memory: 32Mi } }
          readinessProbe: { exec: { command: ["sh", "-c", "true"] } }
          livenessProbe: { exec: { command: ["sh", "-c", "true"] } }
          securityContext: { allowPrivilegeEscalation: false }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: unschedulable-api, namespace: bluearch-eks-lab }
spec:
  replicas: 1
  selector: { matchLabels: { app: unschedulable-api } }
  template:
    metadata: { labels: { app: unschedulable-api } }
    spec:
      nodeSelector: { bluearch.io/nonexistent-pool: required }
      containers:
        - name: app
          image: __NGINX_IMAGE__
          resources: { requests: { cpu: 50m, memory: 32Mi }, limits: { cpu: 250m, memory: 128Mi } }
          readinessProbe: { httpGet: { path: /, port: 80 } }
          livenessProbe: { httpGet: { path: /, port: 80 } }
          securityContext: { allowPrivilegeEscalation: false }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: cpu-pressure-api, namespace: bluearch-eks-lab }
spec:
  replicas: 1
  selector: { matchLabels: { app: cpu-pressure-api } }
  template:
    metadata: { labels: { app: cpu-pressure-api } }
    spec:
      containers:
        - name: app
          image: __BUSYBOX_IMAGE__
          command: ["sh", "-c", "while true; do :; done"]
          resources: { requests: { cpu: 50m, memory: 8Mi }, limits: { cpu: 100m, memory: 32Mi } }
          readinessProbe: { exec: { command: ["sh", "-c", "true"] } }
          livenessProbe: { exec: { command: ["sh", "-c", "true"] } }
          securityContext: { allowPrivilegeEscalation: false }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: cpu-pressure-api, namespace: bluearch-eks-lab }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: cpu-pressure-api }
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: memory-pressure-api, namespace: bluearch-eks-lab }
spec:
  replicas: 1
  selector: { matchLabels: { app: memory-pressure-api } }
  template:
    metadata: { labels: { app: memory-pressure-api } }
    spec:
      containers:
        - name: app
          image: __PYTHON_IMAGE__
          command:
            - python
            - -c
            - "import time; x=[]; exec('while True:\\n x.append(bytearray(1024*1024))\\n time.sleep(20)')"
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 100m, memory: 32Mi } }
          readinessProbe: { exec: { command: ["python", "-c", "print('ok')"] } }
          livenessProbe: { exec: { command: ["python", "-c", "print('ok')"] } }
          securityContext: { allowPrivilegeEscalation: false }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: overprovisioned-api, namespace: bluearch-eks-lab }
spec:
  replicas: 1
  selector: { matchLabels: { app: overprovisioned-api } }
  template:
    metadata: { labels: { app: overprovisioned-api } }
    spec:
      containers:
        - name: app
          image: __NGINX_IMAGE__
          resources: { requests: { cpu: 500m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
          readinessProbe: { httpGet: { path: /, port: 80 } }
          livenessProbe: { httpGet: { path: /, port: 80 } }
          securityContext: { allowPrivilegeEscalation: false }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: runtime-healthy-api, namespace: bluearch-eks-lab }
spec:
  replicas: 1
  selector: { matchLabels: { app: runtime-healthy-api } }
  template:
    metadata: { labels: { app: runtime-healthy-api } }
    spec:
      containers:
        - name: app
          image: __NGINX_IMAGE__
          resources: { requests: { cpu: 50m, memory: 32Mi }, limits: { cpu: 250m, memory: 128Mi } }
          readinessProbe: { httpGet: { path: /, port: 80 } }
          livenessProbe: { httpGet: { path: /, port: 80 } }
          securityContext: { allowPrivilegeEscalation: false }
---
apiVersion: v1
kind: Service
metadata: { name: runtime-healthy-api, namespace: bluearch-eks-lab }
spec:
  selector: { app: runtime-healthy-api }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: runtime-healthy-api, namespace: bluearch-eks-lab }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: runtime-healthy-api } }
