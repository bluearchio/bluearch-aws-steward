apiVersion: v1
kind: Namespace
metadata:
  name: bluearch-eks-healthy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthy-api
  namespace: bluearch-eks-healthy
spec:
  replicas: 1
  selector:
    matchLabels: { app: healthy-api }
  template:
    metadata:
      labels: { app: healthy-api }
    spec:
      containers:
        - name: app
          image: __NGINX_IMAGE__
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
---
apiVersion: v1
kind: Service
metadata:
  name: healthy-api
  namespace: bluearch-eks-healthy
spec:
  selector: { app: healthy-api }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: healthy-api
  namespace: bluearch-eks-healthy
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: healthy-api }
