apiVersion: v1
kind: Namespace
metadata:
  name: bluearch-eks-phase-0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthy-api
  namespace: bluearch-eks-phase-0
  labels:
    app: healthy-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: healthy-api
  template:
    metadata:
      labels:
        app: healthy-api
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: healthy-api
  namespace: bluearch-eks-phase-0
spec:
  type: ClusterIP
  selector:
    app: healthy-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: healthy-api
  namespace: bluearch-eks-phase-0
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: healthy-api
