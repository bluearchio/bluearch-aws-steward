---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-node-fixture
  namespace: kube-system
  labels: {bluearch.io/steward-exempt: "true"}
spec:
  replicas: 1
  selector: {matchLabels: {app: aws-node-fixture}}
  template:
    metadata: {labels: {app: aws-node-fixture, bluearch.io/steward-exempt: "true"}}
    spec:
      containers:
        - name: aws-node
          image: busybox:1.36
          command: [sh, -c, "exit 1"]
---
apiVersion: apps/v1
