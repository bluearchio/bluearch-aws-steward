name: LocalEmu MCP E2E

on:
  push:
    branches: [main]
    paths:
      - "bluearch_aws_steward/**"
      - "tests/aws-emulator/**"
      - "tests/contextual/**"
      - "tests/mcp/**"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-mcp:
    name: LocalEmu MCP E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up uv
        run: python -m pip install --disable-pip-version-check "uv>=0.8,<1"
      - name: Install runtime
        run: uv sync --extra tui --no-editable --locked
      - name: Confirm fixture dependencies
        run: |
          aws --version
          docker compose version
      - name: Run real stdio MCP flow against LocalEmu
        run: make emulator-coverage
      - name: Stop LocalEmu
        if: always()
        run: docker compose -f tests/aws-emulator/docker-compose.yml down --volumes
