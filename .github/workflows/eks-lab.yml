name: EKS MCP functional lab

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eks-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functional-lab:
    name: LocalEmu plus kind E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install uv and kind
        run: |
          python -m pip install --disable-pip-version-check "uv>=0.8,<1"
          go install sigs.k8s.io/kind@v0.32.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - name: Install locked EKS environment
        run: uv sync --extra tui --extra eks --dev --no-editable --locked
      - name: Confirm laboratory dependencies
        run: |
          docker compose version
          kubectl version --client
          kind version
      - name: Run the real stdio MCP EKS product gate
        run: make eks-lab-up eks-lab-full
      - name: Upload functional receipts and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eks-functional-lab-${{ github.run_id }}
          path: tests/eks-lab/.artifacts/
          if-no-files-found: warn
          retention-days: 7
      - name: Tear down the laboratory
        if: always()
        run: make eks-lab-down
