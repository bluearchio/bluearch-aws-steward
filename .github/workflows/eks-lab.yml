name: EKS MCP functional lab

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eks-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functional-lab:
    name: LocalEmu plus kind E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv and kind
        run: |
          python -m pip install --disable-pip-version-check "uv>=0.8,<1"
          go install sigs.k8s.io/kind@v0.32.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - name: Install locked EKS environment
        run: uv sync --extra tui --extra eks --dev --no-editable --locked
      - name: Confirm laboratory dependencies
        run: |
          docker compose version
          kubectl version --client
          kind version
      - name: Run the real stdio MCP EKS product gate
        run: make eks-lab-up eks-lab-full
      - name: Upload functional receipts and report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eks-functional-lab-${{ github.run_id }}
          path: tests/eks-lab/.artifacts/
          if-no-files-found: warn
          retention-days: 7
      - name: Tear down the laboratory
        if: always()
        run: make eks-lab-down
