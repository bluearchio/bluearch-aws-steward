name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        # Test the supported boundary and newest runtime on each change.
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        run: python -m pip install --disable-pip-version-check "uv>=0.8,<1"
      - name: Install runtime
        run: uv sync --extra tui --no-editable --locked
      - name: Run tests and generated-artifact checks
        run: make test

  quality:
    name: Quality and package
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        run: python -m pip install --disable-pip-version-check "uv>=0.8,<1"
      - name: Install quality tools
        run: uv sync --extra tui --dev --no-editable --locked
      - name: Lint and type check
        run: make quality
      - name: Security checks
        run: make security
      - name: Build and validate package
        run: make package
      - name: Upload validated wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: steward-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1

  pip-install:
    name: Plain pip install (Python ${{ matrix.python-version }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download validated wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: steward-wheel
          path: dist
      - name: Install with pip
        run: python -m pip install --disable-pip-version-check dist/*.whl
      - name: Verify complete runtime
        run: |
          python -c "import kubernetes"
          bluearch-steward --version
          bluearch-steward mcp smoke
