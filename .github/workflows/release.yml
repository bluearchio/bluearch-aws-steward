name: Build preview candidate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        run: python -m pip install --disable-pip-version-check "uv>=0.8,<1"
      - name: Install locked release environment
        run: uv sync --extra tui --dev --no-editable --locked
      - name: Verify preview tag and package version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tagged_sha="$(git rev-parse HEAD)"
          comparison_status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${tagged_sha}...main" --jq '.status')"
          case "${comparison_status}" in
            ahead|identical) ;;
            *) echo "Tagged commit is not on main (status: ${comparison_status})" >&2; exit 1 ;;
          esac
          package_version="$(uv run --no-sync python -c 'from bluearch_aws_steward import __version__; print(__version__)')"
          test "${RELEASE_TAG}" = "v${package_version}"
          uv run --no-sync python -c 'from bluearch_aws_steward import __version__; assert any(marker in __version__ for marker in ("a", "b", "rc")), "preview workflow refuses stable versions"'
      - name: Run release gates
        run: make test quality security package-install-smoke
      - name: Create checksums
        run: cd dist && sha256sum *.whl *.tar.gz > ../SHA256SUMS
      - name: Upload immutable release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions-${{ github.ref_name }}
      - name: Publish with a short-lived OIDC credential
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          attestations: true
          skip-existing: false

  verify-testpypi:
    name: Verify TestPyPI installation
    needs: publish-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        run: python -m pip install --disable-pip-version-check "uv>=0.8,<1"
      - name: Resolve the exact uploaded TestPyPI wheel
        id: testpypi-wheel
        env:
          PACKAGE_VERSION: ${{ github.ref_name }}
        run: |
          version="${PACKAGE_VERSION#v}"
          for attempt in 1 2 3 4 5; do
            if PACKAGE_VERSION="${version}" python - <<'PY' > /tmp/testpypi-wheel
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          version = os.environ["PACKAGE_VERSION"]
          endpoint = f"https://test.pypi.org/pypi/bluearch-aws-steward/{version}/json"
          with urllib.request.urlopen(endpoint, timeout=15) as response:
              payload = json.load(response)

          expected = f"bluearch_aws_steward-{version}-py3-none-any.whl"
          matches = [item for item in payload["urls"] if item["filename"] == expected]
          if len(matches) != 1:
              raise SystemExit(f"expected one wheel named {expected}, found {len(matches)}")

          wheel = matches[0]
          url = wheel["url"]
          parsed = urllib.parse.urlparse(url)
          if parsed.scheme != "https" or parsed.hostname != "test-files.pythonhosted.org":
              raise SystemExit(f"unexpected TestPyPI file host: {parsed.hostname}")
          digest = wheel["digests"]["sha256"]
          if not re.fullmatch(r"[0-9a-f]{64}", digest):
              raise SystemExit("TestPyPI returned an invalid SHA-256 digest")
          print(f"{url}#sha256={digest}")
          PY
            then
              break
            fi
            if test "${attempt}" = "5"; then
              exit 1
            fi
            sleep 15
          done
          echo "requirement=$(cat /tmp/testpypi-wheel)" >> "${GITHUB_OUTPUT}"
      - name: Install the uploaded preview
        env:
          PACKAGE_VERSION: ${{ github.ref_name }}
          WHEEL_REQUIREMENT: ${{ steps.testpypi-wheel.outputs.requirement }}
        run: |
          version="${PACKAGE_VERSION#v}"
          UV_TOOL_DIR=/tmp/bluearch-steward-preview-tools \
            UV_TOOL_BIN_DIR=/tmp/bluearch-steward-preview-bin \
            uv tool install --force \
              --default-index https://pypi.org/simple/ \
              "${WHEEL_REQUIREMENT}"
          /tmp/bluearch-steward-preview-bin/bluearch-steward --version | grep -F "${version}"
          /tmp/bluearch-steward-preview-bin/bluearch-steward mcp smoke
          /tmp/bluearch-steward-preview-bin/bluearch-steward mcp install \
            --client cursor --runtime installed --dry-run
          UV_TOOL_DIR=/tmp/bluearch-steward-preview-tools \
            UV_TOOL_BIN_DIR=/tmp/bluearch-steward-preview-bin \
            uv tool uninstall bluearch-aws-steward

  draft-github-prerelease:
    name: Create draft GitHub prerelease
    needs: verify-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download TestPyPI-verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions-${{ github.ref_name }}
      - name: Create draft release for explicit approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.whl dist/*.tar.gz SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft \
            --prerelease \
            --generate-notes \
            --title "BlueArch AWS Steward ${GITHUB_REF_NAME}"
