name: Publish approved preview to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish-pypi:
    name: Publish approved prerelease
    if: ${{ github.event.release.prerelease == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify approved tag and package version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tagged_sha="$(git rev-parse HEAD)"
          comparison_status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${tagged_sha}...main" --jq '.status')"
          case "${comparison_status}" in
            ahead|identical) ;;
            *) echo "Tagged commit is not on main (status: ${comparison_status})" >&2; exit 1 ;;
          esac
          package_version="$(python -c 'from bluearch_aws_steward import __version__; print(__version__)')"
          test "${RELEASE_TAG}" = "v${package_version}"
          python -c 'from bluearch_aws_steward import __version__; assert any(marker in __version__ for marker in ("a", "b", "rc")), "PyPI preview workflow refuses stable versions"'
      - name: Download approved release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir dist
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "*.whl" \
            --pattern "*.tar.gz" \
            --dir dist
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "SHA256SUMS" \
            --dir .
          cd dist
          sha256sum --check ../SHA256SUMS
      - name: Publish checksummed artifacts with OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true
          skip-existing: false
