version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Steward is published to PyPI, so a raised floor is not free: it narrows
    # the environments that can install it in exchange for nothing.
    #
    # `increase-if-necessary` was tried first and measured to have no effect
    # here: after it landed, `@dependabot recreate` still proposed
    # boto3>=1.34 -> >=1.43.62 even though 1.43.62 already satisfied the
    # original constraint. The uv update checker passes
    # `has_lockfile: requirements_text_file?`, which asks for a requirements.txt
    # that a uv project does not have, so the updater believes there is no
    # lockfile and pins the manifest. Grouping from this same file did apply,
    # so the config is read — the strategy simply does not reach that decision.
    #
    # `lockfile-only` stops manifest edits outright. The ranges in
    # pyproject.toml are hand-curated and some are load-bearing — python-hcl2
    # is held below 8 because 8 parses valid Terraform as zero resources, and
    # textual below 1.0 because the TUI has no test coverage — so they are not
    # something to automate. Security fixes still arrive, because uv.lock is
    # what gets updated and what CI installs. A genuine ceiling change becomes
    # a deliberate hand edit, which is what the two pins above already showed
    # it should be.
    versioning-strategy: lockfile-only
    # One PR per group, so runtime and dev updates can be open at the same time.
    open-pull-requests-limit: 2
    groups:
      # Never shipped to users. A ceiling change here is cheap to accept.
      dev-dependencies:
        patterns:
          - bandit*
          - build
          - defusedxml
          - detect-secrets
          - mypy
          - pip-audit
          - ruff
          - twine
      # Everything else ships in the wheel, including the tui extra. Grouped
      # separately because these need real review — python-hcl2 8 parses valid
      # Terraform as zero resources, and textual is pinned below 1.0 because the
      # TUI has no test coverage that could detect a break.
      runtime-dependencies:
        patterns: ["*"]
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
    labels: [dependencies]
